<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare runs</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="/">Gauntlet</a>
  <nav><a href="/">Runs</a><a href="/docs">API</a></nav>
</header>
<main>
  <div class="page-head">
    <h1>Compare runs</h1>
    <p class="muted">One column per run, one row per case. Each cell is how many of the k attempts passed.</p>
  </div>
  <p id="error" class="error" role="alert"></p>
  <section class="card">
    <div id="legend"></div>
    <div class="table-box"><table id="table" class="compare"></table></div>
  </section>
</main>
<script src="/static/app.js"></script>
<script>
const runIds = (new URLSearchParams(location.search).get("runs") || "")
  .split(",").filter(Boolean).map(decodeURIComponent);

function runHeader(view) {
  return el("th", {},
    el("a", { href: `/runs/${encodeURIComponent(view.run_id)}` },
      el("strong", {}, agentLabel(view.config.agent)),
      el("span", { class: "muted small" }, `k = ${view.config.k}`),
      statusChip(view.status)));
}

function totalRow(label, pick) {
  return (views) => el("tr", {}, el("th", {}, label), views.map((view) => {
    const t = totals(view);
    return el("th", {}, `${pick(t)} / ${t.total}`, meter(pick(t), t.total, "pass"));
  }));
}

const passAllRow = totalRow("pass^k: every attempt passed", (t) => t.passesAll);
const passSomeRow = totalRow("pass@k: some attempt passed", (t) => t.passesSome);

function render(views) {
  const caseIds = views.length ? views[0].cases.map((c) => c.case.id) : [];
  const rows = caseIds.map((id) => el("tr", {}, el("td", {}, id), views.map((view) => {
    const found = view.cases.find((c) => c.case.id === id);
    return el("td", {}, found ? scoreBadge(found) : "");
  })));
  document.getElementById("table").replaceChildren(
    el("thead", {}, el("tr", {}, el("th", {}, "Case"), views.map(runHeader))),
    el("tbody", {}, rows),
    el("tfoot", {}, passAllRow(views), passSomeRow(views)),
  );
}

async function refresh() {
  if (runIds.length === 0) {
    document.getElementById("error").textContent = "Pick runs to compare on the start page.";
    return;
  }
  try {
    const views = await Promise.all(runIds.map((id) => api(`/api/runs/${encodeURIComponent(id)}`)));
    render(views);
    if (views.some((v) => v.status === "RUNNING")) setTimeout(refresh, 3000);
  } catch (e) {
    document.getElementById("error").textContent = e.message;
  }
}

document.getElementById("legend").replaceChildren(scoreLegend());
refresh();
</script>
</body>
</html>
