[project]
name = "gauntlet"
version = "0.1.0"
description = "A durable eval runner for AI agents."
authors = [
    { name = "Siddhant Shankar", email = "siddhantshankar02@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic>=2.14.1",
    "temporalio>=1.34.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.mypy]
strict = true
warn_unreachable = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax,
# ASYNC: async pitfalls, DTZ: naive datetimes, S: security basics
select = ["E", "F", "I", "B", "UP", "ASYNC", "DTZ", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
